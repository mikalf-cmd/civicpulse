name: CivicPulse Daily Scraper

on:
  # Run every day at 6:00 AM Eastern (10:00 UTC)
  schedule:
    - cron: '0 10 * * *'

  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # needed to commit updated data file back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        id: scrape
        run: python scraper/scrape.py

      - name: Check if data changed
        id: check
        run: |
          git diff --quiet data/meetings.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "CivicPulse Bot"
          git config user.email "civicpulse-bot@centerforneighborhoods.org"
          git add data/meetings.json
          git commit -m "data: auto-update meetings $(date +'%Y-%m-%d')"
          git push

      - name: No new data
        if: steps.check.outputs.changed == 'false'
        run: echo "No new meeting data found. Data file unchanged."

  # This job only runs if the scrape job fails — sends an alert email
  notify-failure:
    runs-on: ubuntu-latest
    needs: scrape
    if: failure()

    steps:
      - name: Send failure alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASS }}
          subject: "⚠️ CivicPulse Scraper Failed — ${{ github.run_id }}"
          to: mikalf@centerforneighborhoods.org
          from: CivicPulse Bot
          body: |
            The CivicPulse daily scraper failed on ${{ github.run_id }}.

            This means the data on centerforneighborhoods.org/civicpulse
            may not have been updated today.

            View the error log here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Common fixes:
            - Louisville Metro may have updated their website layout
            - Network or rate limit issue (usually resolves itself tomorrow)

            To manually re-run: go to the Actions tab in GitHub and click
            "Run workflow" on the CivicPulse Daily Scraper.

            — CivicPulse Bot
            Center for Neighborhoods
