name: CivicPulse Daily Scraper

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - run: |
          git config user.name "CivicPulse Bot"
          git config user.email "civicpulse-bot@centerforneighborhoods.org"
          git add data/meetings.json
          git diff --staged --quiet || git commit -m "data: auto-update $(date +'%Y-%m-%d')" && git push
